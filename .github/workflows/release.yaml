name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@12
      - run: pnpm install --frozen-lockfile

      # 公開後は取消不可
      - name: Verify tag matches package version
        id: verify
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $pkg"
            exit 1
          fi
          case "${pkg%%+*}" in
            *-*) version_prerelease=true; dist_tag=next ;;
            *) version_prerelease=false; dist_tag=latest ;;
          esac
          if [ "$PRERELEASE" != "$version_prerelease" ]; then
            echo "::error::release prerelease flag ($PRERELEASE) does not match package version $pkg"
            exit 1
          fi
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "publishing $pkg with dist-tag $dist_tag"

      # CIと同じ検査
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:pack

      # 公開済みの版は再公開不可
      - name: Check published version
        id: published
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ -n "$(npm view "mfm-vue@$pkg" version 2> /dev/null)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "mfm-vue@$pkg is already published, skipping npm publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted Publishing, OIDC交換はnpm CLIのみ確実
      - name: Publish to npm
        if: steps.published.outputs.exists == 'false'
        env:
          DIST_TAG: ${{ steps.verify.outputs.dist_tag }}
        run: npm publish --access public --tag "$DIST_TAG"
